<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Square Root Practice — 1000 Questions</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa1ac; --accent:#4f8cff; --good:#3ecf8e; --bad:#ff5d5d; --warn:#ffb84f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:820px; margin:0 auto; padding:24px 16px 60px;}
  h1{font-size:1.5rem; margin:0 0 4px;}
  .subtitle{color:var(--muted); font-size:.9rem; margin-bottom:24px;}

  /* SET MENU */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px;
  }
  .set-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px; cursor:pointer; transition:.15s; text-align:left;
  }
  .set-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .set-card .num{font-size:1.1rem; font-weight:600;}
  .set-card .range{color:var(--muted); font-size:.75rem; margin:4px 0 8px;}
  .set-card .status{font-size:.75rem; padding:3px 8px; border-radius:20px; display:inline-block;}
  .status.new{background:#2a2f3a; color:var(--muted);}
  .status.progress{background:#3a2f10; color:var(--warn);}
  .status.done{background:#123a2a; color:var(--good);}

  /* QUIZ SCREEN */
  .hidden{display:none !important;}
  .quiz-header{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; margin-bottom:20px; flex-wrap:wrap; gap:10px;
  }
  .qh-left{font-size:.9rem; color:var(--muted);}
  .qh-left b{color:var(--text);}
  .timer{font-size:1.3rem; font-weight:700; letter-spacing:1px;}
  .timer.low{color:var(--bad);}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:10px 18px; font-size:.95rem; cursor:pointer; font-weight:600;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn.secondary{background:var(--panel2); border:1px solid var(--border); color:var(--text);}
  .btn.small{padding:6px 12px; font-size:.8rem;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:32px; text-align:center;
  }
  .qnum{color:var(--muted); font-size:.85rem; margin-bottom:10px;}
  .question{font-size:2.2rem; font-weight:700; margin:10px 0 22px;}
  .question sup{font-size:1.2rem; vertical-align:top;}
  .answer-row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap;}
  input[type=number]{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    font-size:1.3rem; padding:10px 14px; border-radius:8px; width:160px; text-align:center;
  }
  input[type=number]:focus{outline:none; border-color:var(--accent);}
  .options-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:460px; margin:0 auto;
  }
  .opt-btn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    font-size:1.15rem; padding:16px 10px; border-radius:10px; cursor:pointer; font-weight:600;
    transition:.15s;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--accent); transform:translateY(-1px);}
  .opt-btn:disabled{cursor:default;}
  .opt-btn.correct{background:#123a2a; border-color:var(--good); color:var(--good);}
  .opt-btn.wrong{background:#3a1414; border-color:var(--bad); color:var(--bad);}
  @media (max-width:480px){ .options-grid{grid-template-columns:1fr;} }
  .feedback{margin-top:20px; font-size:1rem; min-height:24px;}
  .feedback.correct{color:var(--good);}
  .feedback.wrong{color:var(--bad);}
  .explain{color:var(--muted); font-size:.85rem; margin-top:6px;}
  .actions{margin-top:24px; display:flex; justify-content:center; gap:10px;}
  .pause-overlay{
    text-align:center; padding:60px 20px; color:var(--muted); font-size:1.1rem;
  }

  .progressbar{height:6px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-bottom:20px;}
  .progressbar .fill{height:100%; background:var(--accent); transition:width .2s;}

  /* END SCREEN */
  .end-card{text-align:center; padding:20px;}
  .score-big{font-size:3rem; font-weight:800; color:var(--accent); margin:10px 0;}
  .review-list{text-align:left; margin-top:20px; max-height:340px; overflow-y:auto;}
  .review-item{
    display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--border);
    font-size:.9rem;
  }
  .review-item.wrong{color:var(--bad);}
  .review-item.correct{color:var(--good);}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .link-btn{background:none; border:none; color:var(--accent); cursor:pointer; font-size:.85rem; padding:0;}
</style>
</head>
<body>
<div class="wrap">

  <!-- MENU SCREEN -->
  <div id="menuScreen">
    <h1>√ Square Root Practice</h1>
    <div class="subtitle">1000 questions · non-perfect squares below 3600 · 20 sets of 50 · 40-min timer per set</div>
    <div class="grid" id="setGrid"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="hidden">
    <div class="topbar">
      <button class="link-btn" onclick="goToMenu()">&larr; Back to sets</button>
    </div>
    <div class="quiz-header">
      <div class="qh-left">Set <b id="hSetNum"></b> &middot; Question <b id="hQNum"></b>/50 &middot; Score <b id="hScore"></b></div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="timer" id="timerDisplay">40:00</div>
        <button class="btn secondary small" id="pauseBtn" onclick="togglePause()">Pause</button>
      </div>
    </div>
    <div class="progressbar"><div class="fill" id="progressFill" style="width:0%"></div></div>

    <div id="liveCard" class="card">
      <div class="qnum" id="qnumLabel"></div>
      <div class="question" id="questionText"></div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback" id="feedback"></div>
      <div class="explain" id="explain"></div>
      <div class="actions">
        <button class="btn secondary hidden" id="nextBtn" onclick="nextQuestion()">Next Question &rarr;</button>
      </div>
    </div>

    <div id="pauseCard" class="card hidden">
      <div class="pause-overlay">
        ⏸ Quiz paused.<br><br>
        <button class="btn" onclick="togglePause()">Resume</button>
      </div>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="hidden">
    <div class="topbar">
      <button class="link-btn" onclick="goToMenu()">&larr; Back to sets</button>
    </div>
    <div class="card end-card">
      <div style="color:var(--muted);">Set <span id="eSetNum"></span> complete</div>
      <div class="score-big"><span id="eScore"></span>/50</div>
      <div style="color:var(--muted); font-size:.85rem;" id="eTime"></div>
      <div style="margin-top:18px; display:flex; justify-content:center; gap:10px;">
        <button class="btn secondary" onclick="retakeSet()">Retake Set</button>
        <button class="btn" onclick="goToMenu()">Back to Sets</button>
      </div>
      <div class="review-list" id="reviewList"></div>
    </div>
  </div>

</div>

<script>
/* ---------- 1. GENERATE THE 1000-NUMBER POOL (deterministic, seeded) ---------- */
function isPerfectSquare(n){
  const r = Math.round(Math.sqrt(n));
  return r*r === n;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function buildQuestionPool(){
  const pool = [];
  for(let n=2; n<3600; n++){
    if(!isPerfectSquare(n)) pool.push(n);
  }
  // seeded shuffle for a fixed, reproducible order every time the page loads
  const rand = mulberry32(20260806);
  for(let i=pool.length-1; i>0; i--){
    const j = Math.floor(rand()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return pool.slice(0, 1000);
}
const ALL_NUMBERS = buildQuestionPool();
const SETS = [];
for(let s=0; s<20; s++){
  SETS.push(ALL_NUMBERS.slice(s*50, s*50+50));
}

/* Generate 4 answer options for a given number: one correct approx value,
   three distractors spread well apart from the correct value and each other.
   Deterministic per-number so options stay identical across pause/resume/reload. */
function generateOptions(num){
  const trueVal = Math.sqrt(num);
  const correct = +trueVal.toFixed(2);
  const rand = mulberry32(num*9301 + 49297);
  const gapPool = [-20,-17,-14,-11,-8,-6,6,8,11,14,17,20];
  for(let i=gapPool.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [gapPool[i],gapPool[j]] = [gapPool[j],gapPool[i]];
  }
  const options = [correct];
  for(const gap of gapPool){
    if(options.length >= 4) break;
    let val = +(correct + gap).toFixed(2);
    if(val < 1) val = +(correct + Math.abs(gap) + 3).toFixed(2);
    if(options.every(o => Math.abs(o - val) >= 4)){
      options.push(val);
    }
  }
  let extra = 25;
  while(options.length < 4){
    const val = +(correct + extra).toFixed(2);
    if(options.every(o => Math.abs(o - val) >= 4)) options.push(val);
    extra += 15;
  }
  for(let i=options.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [options[i],options[j]] = [options[j],options[i]];
  }
  return { options, correctValue: correct };
}

/* ---------- 2. STATE / STORAGE ---------- */
const STORAGE_KEY = 'sqrt_quiz_v1_progress';
const TIME_LIMIT = 40*60; // 40 minutes in seconds

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
let progress = loadProgress(); // { "0": {currentIndex, answers:[], score, completed, timeRemaining, paused, bestScore} , ... }

let activeSet = null;
let timerInterval = null;
let isPaused = false;

/* ---------- 3. MENU ---------- */
function renderMenu(){
  const grid = document.getElementById('setGrid');
  grid.innerHTML = '';
  for(let i=0;i<20;i++){
    const setData = progress[i];
    let statusClass = 'new', statusText = 'Not started';
    if(setData){
      if(setData.completed){ statusClass='done'; statusText = `Done · ${setData.bestScore ?? setData.score}/50`; }
      else { statusClass='progress'; statusText = `In progress · Q${setData.currentIndex+1}/50`; }
    }
    const from = SETS[i][0], lo = Math.min(...SETS[i]), hi = Math.max(...SETS[i]);
    const div = document.createElement('div');
    div.className = 'set-card';
    div.onclick = () => openSet(i);
    div.innerHTML = `
      <div class="num">Set ${i+1}</div>
      <div class="range">50 questions</div>
      <div class="status ${statusClass}">${statusText}</div>
    `;
    grid.appendChild(div);
  }
}

function goToMenu(){
  stopTimer();
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  renderMenu();
}

/* ---------- 4. OPEN / RUN A SET ---------- */
function openSet(i){
  activeSet = i;
  if(!progress[i]){
    progress[i] = { currentIndex:0, answers:[], score:0, completed:false, timeRemaining:TIME_LIMIT, paused:false };
    saveProgress();
  }
  if(progress[i].completed){
    showEndScreen(i);
    return;
  }
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  isPaused = progress[i].paused || false;
  renderQuestion();
  startTimer();
  updatePauseUI();
}

function currentSetData(){ return progress[activeSet]; }

function renderQuestion(){
  const d = currentSetData();
  const idx = d.currentIndex;
  const num = SETS[activeSet][idx];
  document.getElementById('hSetNum').textContent = activeSet+1;
  document.getElementById('hQNum').textContent = idx+1;
  document.getElementById('hScore').textContent = d.score;
  document.getElementById('qnumLabel').textContent = `Question ${idx+1} of 50`;
  document.getElementById('questionText').innerHTML = `&radic;${num}`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('explain').textContent = '';
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('progressFill').style.width = (idx/50*100)+'%';

  const { options, correctValue } = generateOptions(num);
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  options.forEach(val => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = val.toFixed(2);
    btn.onclick = () => submitAnswer(val, correctValue, btn);
    grid.appendChild(btn);
  });
}

function nearestSquaresExplain(n){
  const lo = Math.floor(Math.sqrt(n));
  const hi = lo+1;
  return `Between ${lo}&sup2;=${lo*lo} and ${hi}&sup2;=${hi*hi}, so &radic;${n} &asymp; ${Math.sqrt(n).toFixed(3)}`;
}

function submitAnswer(userVal, correctValue, clickedBtn){
  if(isPaused) return;
  const d = currentSetData();
  const idx = d.currentIndex;
  const num = SETS[activeSet][idx];
  const trueVal = Math.sqrt(num);
  const feedback = document.getElementById('feedback');
  const explain = document.getElementById('explain');
  const correct = userVal === correctValue;

  if(correct){
    d.score++;
    feedback.textContent = `Correct! √${num} ≈ ${trueVal.toFixed(3)}`;
    feedback.className = 'feedback correct';
    clickedBtn.classList.add('correct');
  } else {
    feedback.textContent = `Not quite. √${num} ≈ ${trueVal.toFixed(3)}`;
    feedback.className = 'feedback wrong';
    clickedBtn.classList.add('wrong');
  }
  explain.innerHTML = nearestSquaresExplain(num);
  d.answers.push({num, userVal, trueVal:+trueVal.toFixed(3), correct});

  const allBtns = document.querySelectorAll('#optionsGrid .opt-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if(parseFloat(b.textContent) === correctValue) b.classList.add('correct');
  });
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('hScore').textContent = d.score;
  saveProgress();
}

function nextQuestion(){
  const d = currentSetData();
  d.currentIndex++;
  if(d.currentIndex >= 50){
    finishSet();
  } else {
    saveProgress();
    renderQuestion();
  }
}

function finishSet(){
  const d = currentSetData();
  d.completed = true;
  d.bestScore = Math.max(d.bestScore ?? 0, d.score);
  stopTimer();
  saveProgress();
  showEndScreen(activeSet);
}

/* ---------- 5. TIMER ---------- */
function startTimer(){
  stopTimer();
  timerInterval = setInterval(() => {
    if(isPaused) return;
    const d = currentSetData();
    d.timeRemaining--;
    if(d.timeRemaining <= 0){
      d.timeRemaining = 0;
      updateTimerDisplay();
      finishSet();
      return;
    }
    updateTimerDisplay();
    if(d.timeRemaining % 5 === 0) saveProgress();
  }, 1000);
  updateTimerDisplay();
}
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay(){
  const d = currentSetData();
  if(!d) return;
  const m = Math.floor(d.timeRemaining/60);
  const s = d.timeRemaining%60;
  const el = document.getElementById('timerDisplay');
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('low', d.timeRemaining <= 60);
}

function togglePause(){
  isPaused = !isPaused;
  const d = currentSetData();
  d.paused = isPaused;
  saveProgress();
  updatePauseUI();
}
function updatePauseUI(){
  document.getElementById('pauseBtn').textContent = isPaused ? 'Resume' : 'Pause';
  document.getElementById('liveCard').classList.toggle('hidden', isPaused);
  document.getElementById('pauseCard').classList.toggle('hidden', !isPaused);
}

/* ---------- 6. END SCREEN ---------- */
function showEndScreen(i){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  const d = progress[i];
  document.getElementById('eSetNum').textContent = i+1;
  document.getElementById('eScore').textContent = d.bestScore ?? d.score;
  const usedSeconds = TIME_LIMIT - (d.timeRemaining ?? 0);
  const mm = Math.floor(usedSeconds/60), ss = usedSeconds%60;
  document.getElementById('eTime').textContent = `Time used: ${mm}m ${ss}s`;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  (d.answers || []).forEach((a,idx) => {
    const row = document.createElement('div');
    row.className = 'review-item ' + (a.correct ? 'correct' : 'wrong');
    row.innerHTML = `<span>Q${idx+1}: √${a.num}</span><span>${a.correct ? '✓ ' + a.userVal : `✗ picked ${a.userVal}, ans ${a.trueVal}`}</span>`;
    reviewList.appendChild(row);
  });
}

function retakeSet(){
  progress[activeSet] = { currentIndex:0, answers:[], score:0, completed:false, timeRemaining:TIME_LIMIT, paused:false, bestScore: progress[activeSet]?.bestScore ?? 0 };
  saveProgress();
  openSet(activeSet);
}

/* ---------- 7. INIT ---------- */
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !document.getElementById('nextBtn').classList.contains('hidden')){
    nextQuestion();
  }
});

renderMenu();
</script>
</body>
</html>
