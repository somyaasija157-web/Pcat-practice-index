<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubes Quiz (MCQ): 1 to 100</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --green: #22c55e;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --opt-bg: #0f172a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px 0;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0;
    font-size: 0.9rem;
  }
  #scoreBar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    font-size: 0.95rem;
  }
  #scoreBar span#scoreText {
    font-weight: 600;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:active {
    transform: scale(0.97);
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }
  .qbox {
    background: var(--card);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .qlabel {
    font-size: 0.9rem;
    color: var(--muted);
  }
  .qlabel b {
    color: var(--text);
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .option {
    background: var(--opt-bg);
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 0.85rem;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .option:hover {
    border-color: var(--accent);
  }
  .option.selected {
    border-color: var(--accent);
    background: rgba(56,189,248,0.15);
  }
  .qbox.correct .option.selected {
    border-color: var(--green);
    background: rgba(34,197,94,0.2);
  }
  .qbox.wrong .option.selected {
    border-color: var(--red);
    background: rgba(239,68,68,0.2);
  }
  .qbox.wrong .option.correctAnswer {
    border-color: var(--green);
    background: rgba(34,197,94,0.2);
  }
  #bottomBar {
    margin-top: 20px;
    text-align: center;
    padding-bottom: 30px;
  }
  #bottomBar button {
    padding: 12px 28px;
    font-size: 1rem;
  }
</style>
</head>
<body>

<header>
  <h1>Cubes Quiz (MCQ) — 1 to 100</h1>
  <p class="subtitle">Tap the correct cube for each number, then hit Submit to check your answers.</p>
</header>

<div id="scoreBar">
  <span id="scoreText">Not submitted yet</span>
  <button id="resetBtn">Reset</button>
</div>

<div id="grid"></div>

<div id="bottomBar">
  <button id="submitBtn">Submit Answers</button>
</div>

<script>
  const grid = document.getElementById('grid');
  const total = 100;
  const answers = {}; // qIndex -> selected value

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateDistractors(n, correct) {
    const options = new Set([correct]);
    // Widely spaced distractors: nearby cubes, a swapped-digit value, and a random offset
    const candidates = [];

    if (n > 1) candidates.push((n - 1) ** 3);
    if (n < total) candidates.push((n + 1) ** 3);
    if (n > 2) candidates.push((n - 2) ** 3);
    if (n < total - 1) candidates.push((n + 2) ** 3);

    // percentage-based offsets for wider spacing
    candidates.push(Math.round(correct * 1.15));
    candidates.push(Math.round(correct * 0.85));
    candidates.push(correct + Math.round(correct * 0.05) + 17);
    candidates.push(Math.max(1, correct - Math.round(correct * 0.07) - 23));

    shuffle(candidates);

    for (const c of candidates) {
      if (options.size >= 4) break;
      if (c > 0 && !options.has(c)) options.add(c);
    }

    // fallback fill if still short
    let filler = 1;
    while (options.size < 4) {
      const val = correct + filler * 31 + 5;
      if (!options.has(val) && val > 0) options.add(val);
      filler++;
    }

    return shuffle(Array.from(options));
  }

  for (let i = 1; i <= total; i++) {
    const correct = i * i * i;
    const opts = generateDistractors(i, correct);

    const box = document.createElement('div');
    box.className = 'qbox';
    box.id = 'box' + i;

    const label = document.createElement('div');
    label.className = 'qlabel';
    label.innerHTML = `<b>${i}</b>³ = ?`;
    box.appendChild(label);

    const optDiv = document.createElement('div');
    optDiv.className = 'options';

    opts.forEach(val => {
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.textContent = val;
      opt.dataset.value = val;
      if (val === correct) opt.dataset.correct = "true";

      opt.addEventListener('click', () => {
        // deselect siblings
        optDiv.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        answers[i] = val;
      });

      optDiv.appendChild(opt);
    });

    box.appendChild(optDiv);
    grid.appendChild(box);
  }

  function checkAnswers() {
    let correctCount = 0;
    let attempted = 0;

    for (let i = 1; i <= total; i++) {
      const box = document.getElementById('box' + i);
      const correct = i * i * i;
      const selectedOpt = box.querySelector('.option.selected');

      box.classList.remove('correct', 'wrong');

      if (!selectedOpt) continue;
      attempted++;

      const selectedVal = parseInt(selectedOpt.dataset.value, 10);
      if (selectedVal === correct) {
        box.classList.add('correct');
        correctCount++;
      } else {
        box.classList.add('wrong');
        box.querySelectorAll('.option').forEach(o => {
          if (o.dataset.correct === "true") o.classList.add('correctAnswer');
        });
      }
    }

    const scoreText = document.getElementById('scoreText');
    scoreText.textContent = `Score: ${correctCount} / ${total}  (Attempted: ${attempted})`;
  }

  function resetQuiz() {
    for (let i = 1; i <= total; i++) {
      const box = document.getElementById('box' + i);
      box.classList.remove('correct', 'wrong');
      box.querySelectorAll('.option').forEach(o => {
        o.classList.remove('selected', 'correctAnswer');
      });
      delete answers[i];
    }
    document.getElementById('scoreText').textContent = 'Not submitted yet';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('submitBtn').addEventListener('click', checkAnswers);
  document.getElementById('resetBtn').addEventListener('click', resetQuiz);
</script>

</body>
</html>
